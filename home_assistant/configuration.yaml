# ---------------------------------------------------------
# GRIDWATCH v2.0 - HOME ASSISTANT CONFIGURATION
# ---------------------------------------------------------
# INSTRUCTIONS:
# 1. Go to HA Settings -> Devices & Services -> Helpers -> Create Helper
# 2. Create 'Number' helper: Name "GridWatch Price Cap", Entity ID "input_number.gridwatch_price_cap"
# 3. Create 'Number' helper: Name "GridWatch Stress Cap", Entity ID "input_number.gridwatch_stress_cap"
# ---------------------------------------------------------

sensor:
  - platform: rest
    name: "GridWatch Telemetry"
    unique_id: "gridwatch_telemetry_v2"
    resource: "https://gridwatch-us-telemetry.p.rapidapi.com/api/curtailment"
    method: GET
    headers:
      X-RapidAPI-Key: !secret gridwatch_api_key
      X-RapidAPI-Host: "gridwatch-us-telemetry.p.rapidapi.com"
    params:
      region: "ERCOT" # Change to your region
      # DYNAMIC: Sends your Dashboard Slider values to the API
      price_cap: "{{ states('input_number.gridwatch_price_cap') | default(0.20) | float * 1000 }}"
      stress_cap: "{{ states('input_number.gridwatch_stress_cap') | default(90) | int }}"

    value_template: >-
      {% set p = value_json.metrics.price_usd %}
      {% if p is not none %}
        {{ (p | float / 1000) | round(5) }}
      {% else %}
        unavailable
      {% endif %}

    unit_of_measurement: "USD/kWh"
    scan_interval: 300 # 5 Minutes
    json_attributes_path: "$"
    json_attributes:
      - metrics
      - curtail
      - trigger_reason

# LOGIC ENGINE (Binary Sensors)
binary_sensor:
  - platform: template
    sensors:
      # SIGNAL 1: CURTAILMENT (Safety Stop)
      # Logic is now handled by the API based on the params sent above.
      # If API returns "curtail": true, this sensor turns ON.
      gridwatch_curtail_signal:
        friendly_name: "GridWatch: Curtailment Active"
        value_template: >-
          {{ value_json.curtail | default(False) }}
        delay_off: "00:15:00" # Safety Hysteresis

      # SIGNAL 2: DISPATCH (Opportunity Start)
      # Trigger: Price < $0.00 (Negative/Free Power)
      gridwatch_dispatch_signal:
        friendly_name: "GridWatch: Economic Dispatch"
        value_template: >-
          {% set price = states('sensor.gridwatch_telemetry') %}
          {% if price != 'unavailable' and price | float(999) <= 0.00 %}
            {{ true }}
          {% else %}
            {{ false }}
          {% endif %}
        delay_on: "00:05:00"
